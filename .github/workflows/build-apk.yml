name: Build & Sign Android APK & Bundle

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - release_apk
          - release_aab
          - debug_apk

jobs:
  build:
    name: Build Lumify (${{ inputs.target }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore (if GitHub Secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks" >> $GITHUB_ENV
            echo "Release keystore decoded successfully."
          else
            echo "No custom release keystore secret provided. Building without custom signature."
          fi

      - name: Build Debug APK
        if: ${{ inputs.target == 'debug_apk' || inputs.target == 'all' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ inputs.target == 'release_apk' || inputs.target == 'all' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB (Google Play Store Bundle)
        if: ${{ inputs.target == 'release_aab' || inputs.target == 'all' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload APK Artifacts
        if: ${{ inputs.target == 'debug_apk' || inputs.target == 'release_apk' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: Lumify-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload AAB Play Store Bundle
        if: ${{ inputs.target == 'release_aab' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: Lumify-Release-AAB
          path: app/build/outputs/bundle/**/*.aab
          retention-days: 14
