name: Build & Sign Android APK & Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - release_apk
          - release_aab
          - debug_apk

jobs:
  build:
    name: Build Lumify (${{ inputs.target || 'all' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore (if GitHub Secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks" >> $GITHUB_ENV
            echo "Release keystore decoded successfully."
          else
            echo "No custom release keystore secret provided. Building without custom signature."
          fi

      - name: Build Debug APK
        if: ${{ inputs.target == '' || inputs.target == 'debug_apk' || inputs.target == 'all' }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_debug.log

      - name: Build Release APK
        if: ${{ inputs.target == '' || inputs.target == 'release_apk' || inputs.target == 'all' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build_release.log

      - name: Build Release AAB (Google Play Store Bundle)
        if: ${{ inputs.target == '' || inputs.target == 'release_aab' || inputs.target == 'all' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew bundleRelease --stacktrace --no-daemon 2>&1 | tee build_bundle.log

      - name: Publish Diagnostic Summary
        if: always()
        run: |
          echo "## Build Diagnostics" >> $GITHUB_STEP_SUMMARY
          if [ -f build_debug.log ]; then
            echo "### Debug Build Log (Last 120 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_debug.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f build_release.log ]; then
            echo "### Release Build Log (Last 120 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_release.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Build Logs & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: |
            *.log
            app/build/reports/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        if: ${{ inputs.target == '' || inputs.target == 'debug_apk' || inputs.target == 'release_apk' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: Lumify-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload AAB Play Store Bundle
        if: ${{ inputs.target == '' || inputs.target == 'release_aab' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: Lumify-Release-AAB
          path: app/build/outputs/bundle/**/*.aab
          retention-days: 14
